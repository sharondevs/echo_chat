name: Deploying to Azure Container apps

on:
    workflow_dispatch:
    push:
        branches: [main, dev]

env:
    AZURE_CONTAINER_REGISTRY: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
    RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
    CONTAINER_APP_NAME: echo-chat
    CONTAINER_APP_ENVIRONMENT: echo-chat-env

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Azure Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io
                  username: ${{ secrets.ACR_USERNAME }}
                  password: ${{ secrets.ACR_PASSWORD }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_APP_NAME }}:${{ github.sha }}

            - name: Log in to Azure
              uses: azure/login@v2
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: Deploy to Azure Container Apps
              run: |
                  # Create Container App Environment if it doesn't exist
                  if ! az containerapp env show --name ${{ env.CONTAINER_APP_ENVIRONMENT }} --resource-group ${{ env.RESOURCE_GROUP }} --output none 2>/dev/null; then
                    echo "Creating Container App Environment..."
                    az containerapp env create \
                      --name ${{ env.CONTAINER_APP_ENVIRONMENT }} \
                      --resource-group ${{ env.RESOURCE_GROUP }} \
                      --location eastus
                  fi
                  
                  # Delete existing Container App if it exists and is in failed state
                  if az containerapp show --name ${{ env.CONTAINER_APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --output none 2>/dev/null; then
                    PROVISIONING_STATE=$(az containerapp show \
                      --name ${{ env.CONTAINER_APP_NAME }} \
                      --resource-group ${{ env.RESOURCE_GROUP }} \
                      --query "properties.provisioningState" \
                      --output tsv 2>/dev/null || echo "Unknown")
                    
                    if [ "$PROVISIONING_STATE" = "Failed" ] || [ "$PROVISIONING_STATE" = "Unknown" ]; then
                      echo "Container App is in $PROVISIONING_STATE state. Deleting it..."
                      az containerapp delete \
                        --name ${{ env.CONTAINER_APP_NAME }} \
                        --resource-group ${{ env.RESOURCE_GROUP }} \
                        --yes
                      echo "Waiting for deletion to complete..."
                      sleep 30
                    fi
                  fi
                  
                  # Create or update Container App
                  az containerapp create \
                    --name ${{ env.CONTAINER_APP_NAME }} \
                    --resource-group ${{ env.RESOURCE_GROUP }} \
                    --environment ${{ env.CONTAINER_APP_ENVIRONMENT }} \
                    --image ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_APP_NAME }}:${{ github.sha }} \
                    --target-port 8000 \
                    --ingress external \
                    --registry-server ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io \
                    --registry-username ${{ secrets.ACR_USERNAME }} \
                    --registry-password ${{ secrets.ACR_PASSWORD }} \
                    --cpu 0.25 \
                    --memory 0.5Gi \
                    --min-replicas 0 \
                    --max-replicas 3 \
                    --env-vars \
                      GOOGLE_API_KEY="${{ secrets.GOOGLE_API_KEY }}" \
                      ENVIRONMENT="production" \
                      LOG_LEVEL="INFO" \
                      RESUME_PATH="/app/data/resume" \
                      DOCUMENTS_PATH="/app/data/documents" \
                      CHROMA_DB_PATH="/app/data/chroma_db"

            - name: Get Container App URL
              run: |
                  APP_URL=$(az containerapp show \
                    --name ${{ env.CONTAINER_APP_NAME }} \
                    --resource-group ${{ env.RESOURCE_GROUP }} \
                    --query "properties.configuration.ingress.fqdn" \
                    --output tsv)
                  echo " Application deployed successfully!"
                  echo " App URL: https://$APP_URL"
                  echo " Health Check: https://$APP_URL/health"
                  echo " API Docs: https://$APP_URL/docs"