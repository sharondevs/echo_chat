name: Deploying to Azure Container apps

on:
    workflow_dispatch:
    push:
        branches: [main, dev]

env:
    AZURE_CONTAINER_REGISTRY: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
    RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
    CONTAINER_APP_NAME: echo-chat

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Azure Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io
                  username: ${{ secrets.ACR_USERNAME }}
                  password: ${{ secrets.ACR_PASSWORD }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_APP_NAME }}:${{ github.sha }}

            - name: Log in to Azure
              uses: azure/login@v2
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: Deploy to Azure Container Apps
              uses: azure/container-apps-deploy-action@v1
              with:
                  resource-group: ${{ env.RESOURCE_GROUP }}
                  container-app-name: ${{ env.CONTAINER_APP_NAME }}
                  container-image: ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_APP_NAME }}:${{ github.sha }}
                  target-port: 8000
                  ingress: external

            - name: Get Container App URL
              run: |
                  APP_URL=$(az containerapp show \
                    --name ${{ env.CONTAINER_APP_NAME }} \
                    --resource-group ${{ env.RESOURCE_GROUP }} \
                    --query "properties.configuration.ingress.fqdn" \
                    --output tsv)
                  echo " Application deployed successfully!"
                  echo " App URL: https://$APP_URL"
                  echo " Health Check: https://$APP_URL/health"
                  echo " API Docs: https://$APP_URL/docs"
